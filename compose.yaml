services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scs
      POSTGRES_PASSWORD: scs
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - scs-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scs -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  scs-postgres:

