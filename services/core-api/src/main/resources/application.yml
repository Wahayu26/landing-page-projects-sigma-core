spring:
  application:
    name: sigma-core-api
  datasource:
    url: ${CORE_DATABASE_URL:jdbc:postgresql://localhost:5432/scs_core}
    username: ${CORE_DATABASE_USERNAME:scs}
    password: ${CORE_DATABASE_PASSWORD:scs}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

