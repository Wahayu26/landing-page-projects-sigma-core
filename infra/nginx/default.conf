upstream scs_web {
    server web:3000;
    keepalive 32;
}


# =========================================================
# HTTP -> HTTPS
# =========================================================
server {
    listen 80;
    listen [::]:80;

    server_name
        sigmacore.id
        www.sigmacore.id
        cms.sigmacore.id
        mail.sigmacore.id;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# =========================================================
# PUBLIC WEBSITE
# https://sigmacore.id
# https://www.sigmacore.id
# =========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name
        sigmacore.id
        www.sigmacore.id;

    ssl_certificate     /etc/letsencrypt/live/mail.sigmacore.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.sigmacore.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;


    # Block Payload CMS from public domain
    location ^~ /admin {
        return 404;
    }


    location / {
        proxy_pass http://scs_web;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}


# =========================================================
# PAYLOAD CMS
# https://cms.sigmacore.id
# =========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name cms.sigmacore.id;

    ssl_certificate     /etc/letsencrypt/live/mail.sigmacore.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.sigmacore.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;


    # Root CMS -> login
    location = / {
        return 302 /admin/login;
    }


    # Payload Admin
    location ^~ /admin {
        proxy_pass http://scs_web;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }


    # Payload API, Next.js assets, uploads, etc.
    location / {
        proxy_pass http://scs_web;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}


# =========================================================
# ZIMBRA WEBMAIL
# https://mail.sigmacore.id
#
# Host:
# 10.100.108.222:8080 -> Zimbra container :443
# =========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name mail.sigmacore.id;

    ssl_certificate     /etc/letsencrypt/live/mail.sigmacore.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.sigmacore.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;


    location / {
        proxy_pass https://host.docker.internal:8080;

        # Zimbra origin HTTPS may use its own/internal certificate
        proxy_ssl_verify off;
        proxy_ssl_server_name on;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
